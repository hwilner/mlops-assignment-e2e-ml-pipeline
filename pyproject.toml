[project]
name = "mlops-assignment-e2e-ml-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mini-swe-agent>=2.4.1",
    "swebench>=4.1.0",
    "apache-airflow[postgres]>=2.9,<3",
    "mlflow>=2.13.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The lint rule set is stated explicitly so that the result of the check does
# not depend on which rules a given ruff release enables by default.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DTZ", "RUF"]
